<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff0000">
<title>Reset Password | YT Creator Pro</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon-user.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="yt-user-auth-page">
<header class="yt-user-auth-header">
  <a class="yt-user-public-brand" href="index.html"><span class="yt-user-play-logo">▶</span><div><b>YT Creator Pro</b><small>Creator Support Portal</small></div></a>
  <nav><a href="index.html">Home</a><a href="login.html">Login</a><a href="register.html">Register</a></nav>
</header>
<main class="yt-user-auth-shell">
  <section class="yt-user-auth-card-wrap" style="width:100%;max-width:560px;margin:auto">
    <form class="yt-user-auth-card" id="forgotForm">
      <div class="yt-user-auth-switch"><a href="login.html">Login</a><a class="active" href="reset-password.html">Reset Password</a></div>
      <div class="yt-user-auth-heading"><span>ACCOUNT RECOVERY</span><h1>Forgot Password</h1><p>Enter your registered email to receive a secure password reset link.</p></div>
      <label>Email ID</label>
      <div class="yt-user-auth-input"><span>✉</span><input id="resetEmail" type="email" required placeholder="Email ID" autocomplete="email"></div>
      <button class="yt-user-auth-submit" type="submit">Send Reset Link</button>
      <div id="forgotMessage" class="message"></div>
    </form>
    <form class="yt-user-auth-card" id="updateForm" hidden>
      <div class="yt-user-auth-heading"><span>SECURE PASSWORD UPDATE</span><h1>Reset Password</h1><p>Create a new password for your YT Creator Pro account.</p></div>
      <label>New Password</label>
      <div class="yt-user-auth-input"><span>●</span><input id="newPassword" type="password" minlength="6" required placeholder="New Password" autocomplete="new-password"></div>
      <label>Confirm Password</label>
      <div class="yt-user-auth-input"><span>●</span><input id="confirmPassword" type="password" minlength="6" required placeholder="Confirm Password" autocomplete="new-password"></div>
      <button class="yt-user-auth-submit" type="submit">Update Password</button>
      <div id="updateMessage" class="message"></div>
    </form>
  </section>
</main>
<script type="module">
import { supabase } from './assets/js/supabase.js';
const $=id=>document.getElementById(id);
const show=(id,text,ok=false)=>{const e=$(id);if(e){e.textContent=text;e.className=ok?'message ok':'message';}};
const forgot=$('forgotForm'), update=$('updateForm');
async function syncMode(){
  const {data}=await supabase.auth.getSession();
  const recovery=location.hash.includes('access_token=')||location.hash.includes('type=recovery');
  if(data?.session && recovery){forgot.hidden=true;update.hidden=false;}
}
supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){forgot.hidden=true;update.hidden=false;}});
forgot.addEventListener('submit',async e=>{
  e.preventDefault(); const btn=forgot.querySelector('button[type=submit]'); if(btn)btn.disabled=true; show('forgotMessage','Sending reset link...');
  try{
    const email=$('resetEmail').value.trim(); if(!email)throw new Error('Enter your email address.');
    const redirectTo=new URL('reset-password.html',location.href).href;
    const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error; show('forgotMessage','Reset link sent. Check your email and open the link to create a new password.',true);
  }catch(err){show('forgotMessage',err?.message||'Unable to send reset link.');}finally{if(btn)btn.disabled=false;}
});
update.addEventListener('submit',async e=>{
  e.preventDefault(); const btn=update.querySelector('button[type=submit]'); if(btn)btn.disabled=true;
  try{const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<6)throw new Error('Password must be at least 6 characters.');if(a!==b)throw new Error('Passwords do not match.');const {error}=await supabase.auth.updateUser({password:a});if(error)throw error;show('updateMessage','Password updated successfully. Redirecting to Login...',true);await supabase.auth.signOut();setTimeout(()=>location.href='login.html',800);}catch(err){show('updateMessage',err?.message||'Password update failed.');}finally{if(btn)btn.disabled=false;}
});
syncMode();
</script>
</body></html>
