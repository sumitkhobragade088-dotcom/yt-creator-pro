<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | YT Creator Pro</title><link rel="stylesheet" href="assets/css/style.css"><link rel="icon" type="image/svg+xml" href="assets/icons/favicon-user.svg"></head><body class="yt-user-auth-page"><main class="yt-user-auth-shell"><section class="yt-user-auth-card-wrap"><form class="yt-user-auth-card" id="resetPasswordForm"><div class="yt-user-auth-heading"><span>SECURE USER ACCESS</span><h1>Reset Password</h1><p id="resetHint">Set a new website password.</p></div><div id="requestBox"><label>Email ID</label><div class="yt-user-auth-input"><span>✉</span><input id="resetEmail" type="email" required placeholder="Registered Email ID"></div><button class="yt-user-auth-submit" id="sendReset" type="button">Send Reset Link</button></div><div id="passwordBox" hidden><label>New Password</label><div class="yt-user-auth-input"><span>●</span><input id="newPassword" type="password" minlength="8" placeholder="New Password"></div><label>Confirm Password</label><div class="yt-user-auth-input"><span>●</span><input id="confirmPassword" type="password" minlength="8" placeholder="Confirm Password"></div><button class="yt-user-auth-submit" type="submit">Update Password</button></div><div id="message" class="message"></div><div class="yt-user-auth-links"><a href="login.html">Back to Login</a></div></form></section></main><script type="module">
import { supabase } from './assets/js/supabase.js';
const $=id=>document.getElementById(id), msg=(t,ok=false)=>{const e=$("message");e.textContent=t;e.className=ok?'message ok':'message';};
const params=new URLSearchParams(location.search);
async function detect(){const {data}=await supabase.auth.getSession(); if(data?.session){$("requestBox").hidden=true;$("passwordBox").hidden=false;$("resetHint").textContent='Enter your new website password.';}}
detect();
$("sendReset").onclick=async()=>{const email=$("resetEmail").value.trim();if(!email)return msg('Enter your registered email.');const b=$("sendReset");b.disabled=true;msg('Sending reset link...');try{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset-password.html',location.href).href});if(error)throw error;msg('Reset link sent. Check your email.',true);}catch(e){msg(e?.message||'Unable to send reset link.');}finally{b.disabled=false;}};
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){$("requestBox").hidden=true;$("passwordBox").hidden=false;$("resetHint").textContent='Enter your new website password.';}});
$("resetPasswordForm").onsubmit=async e=>{e.preventDefault();const a=$("newPassword").value,b=$("confirmPassword").value;if(a.length<8)return msg('Password must be at least 8 characters.');if(a!==b)return msg('Passwords do not match.');try{const {error}=await supabase.auth.updateUser({password:a});if(error)throw error;msg('Password updated successfully. Please login again.',true);setTimeout(()=>location.href='login.html',900);}catch(e){msg(e?.message||'Password update failed.');}};
</script></body></html>
