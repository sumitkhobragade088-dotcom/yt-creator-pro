<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Dashboard | YT Creator Pro</title><link rel="stylesheet" href="assets/css/style.css"><style>:root{--staff-accent:#2563eb}body{margin:0;background:#f6f8fb;color:#172033;font-family:Arial,sans-serif}.staff-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:2}.staff-brand{display:flex;gap:12px;align-items:center}.staff-badge{width:44px;height:44px;border-radius:13px;background:var(--staff-accent);color:#fff;display:grid;place-items:center;font-weight:900}.staff-head h1{margin:0;font-size:22px}.staff-head p{margin:4px 0 0;color:#667085;font-size:13px}.staff-logout{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff;font-weight:800}.staff-main{max-width:1180px;margin:auto;padding:28px 20px}.staff-hero,.staff-module,.staff-note{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 7px 22px rgba(15,23,42,.05)}.staff-hero{padding:24px;margin-bottom:18px}.role{display:inline-flex;padding:7px 11px;border-radius:999px;background:#f1f5f9;color:var(--staff-accent);font-weight:900;font-size:12px}.staff-hero h2{font-size:30px;margin:12px 0 6px}.staff-hero p{margin:0;color:#667085}.staff-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.staff-module{padding:18px;text-align:left}.staff-module span{font-size:25px}.staff-module b{display:block;margin-top:10px}.staff-module small{display:block;margin-top:5px;color:#667085}.staff-empty{padding:22px;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;color:#667085;grid-column:1/-1}.staff-note{margin-top:18px;padding:14px;color:#667085}@media(max-width:900px){.staff-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.staff-grid{grid-template-columns:1fr}.staff-main{padding:18px 12px}}</style></head><body data-staff-role="support"><header class="staff-head"><div class="staff-brand"><div class="staff-badge">YT</div><div><h1>YT Creator Pro</h1><p id="staffEmail"></p></div></div><button id="staffLogout" class="staff-logout">Logout</button></header><main class="staff-main"><section class="staff-hero"><span class="role">Support Dashboard</span><h2 id="staffWelcome">Welcome Support</h2><p>Only permissions assigned by Admin are available here.</p></section><section id="staffModules" class="staff-grid"></section><div class="staff-note">🔒 Role, status and permissions are controlled by Super Admin.</div></main><script type="module" src="assets/js/staff-dashboard.js"></script></body></html>
