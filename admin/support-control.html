<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Control | YT Creator Pro</title><link rel="stylesheet" href="../assets/css/style.css"><style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:0 auto;padding:24px}.top{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 8px 26px rgba(15,23,42,.07)}.brand{display:flex;align-items:center;gap:13px}.badge{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#16a34a,#eab308,#ec4899,#ef4444,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0;color:#667085}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.back{background:#111827;color:#fff}.refresh{background:#eef2ff;color:#27336b}.hero{margin-top:18px;background:linear-gradient(135deg,#fff,#f8fafc);border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 8px 26px rgba(15,23,42,.06)}.hero h2{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:#667085}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.stat,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 7px 22px rgba(15,23,42,.05)}.stat b{display:block;font-size:28px;margin-top:5px}.stat small{color:#667085}.panel{margin-top:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel h3{margin:0;font-size:19px}.search{padding:10px 12px;border:1px solid #d0d5dd;border-radius:10px;min-width:240px}.table-wrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f3;font-size:13px}th{background:#f8fafc}.status{padding:5px 9px;border-radius:999px;font-weight:900;font-size:11px}.status.active{background:#dcfce7;color:#166534}.status.inactive{background:#fef3c7;color:#92400e}.status.suspended{background:#fee2e2;color:#991b1b}select{padding:8px;border:1px solid #d0d5dd;border-radius:8px}.save{margin-left:7px;border:0;border-radius:8px;padding:8px 10px;background:#2563eb;color:#fff;font-weight:800}.permission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.perm{display:flex;flex-direction:column;gap:4px;border:1px solid #e5e7eb;border-radius:13px;padding:12px;background:#fff;cursor:pointer}.perm:hover{box-shadow:0 4px 14px rgba(15,23,42,.07)}.perm input{width:18px;height:18px}.perm span{font-weight:800}.perm small{color:#667085}.empty{text-align:center;color:#667085;padding:25px}.message{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412}.message.show{display:block}@media(max-width:800px){.stats{grid-template-columns:1fr}.permission-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.permission-grid{grid-template-columns:1fr}.wrap{padding:12px}.search{min-width:0;width:100%}}

/* TOTAL CONTROL responsive polish */
@media(max-width:760px){
  .wrap{padding:12px}
  .top{flex-direction:column;align-items:flex-start}
  .actions{width:100%}
  .actions .btn{flex:1}
  .hero{padding:16px}
  .grid{grid-template-columns:1fr!important}
  .perm-grid{grid-template-columns:1fr!important}
  table{display:block;overflow-x:auto;white-space:nowrap}
}
.perm input[type="checkbox"]{accent-color:#ec4899;}
.status.active{background:#dcfce7;color:#166534}
.status.inactive{background:#fef3c7;color:#92400e}
.status.suspended{background:#fee2e2;color:#991b1b}
</style></head><body data-control-role="support"><div class="wrap"><header class="top"><div class="brand"><div class="badge">YT</div><div><h1>YT Creator Pro</h1><p>Super Admin Control • <span id="adminEmail"></span></p></div></div><div class="actions"><button id="backAdmin" class="btn back">← Admin Dashboard</button><button id="refresh" class="btn refresh">↻ Refresh</button></div></header><section class="hero"><h2 id="pageTitle">Support Control</h2><p id="pageSubtitle">Complete Support staff control.</p></section><section class="stats"><div class="stat"><small>Support Staff</small><b id="staffCount">0</b></div><div class="stat"><small>Active</small><b id="activeCount">0</b></div><div class="stat"><small>Enabled Permissions</small><b id="permCount">0</b></div></section><section class="panel"><div class="panel-head"><h3>Support Staff Accounts</h3></div><div class="table-wrap"><table><thead><tr><th>Email</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="staffBody"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><h3>Support — A–Z Permission Control</h3><div class="actions"><input id="search" class="search" placeholder="Search permission…"><button id="selectAll" class="btn refresh">Select All</button><button id="clearAll" class="btn back">Clear All</button></div></div><div id="permissionGrid" class="permission-grid"></div><div id="message" class="message"></div></section></div><script type="module" src="../assets/js/staff-role-admin-control.js"></script></body></html>
